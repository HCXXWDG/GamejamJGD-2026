[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True

; ---------------------------------------------------------------------------
; 事件总线频道 Tag 列表
;
; 平时不用手改这个文件：在编辑器里打开
;   项目设置 → Gameplay Tags → Gameplay Tag List → Add
; 新增/修改的 Tag 会自动写回这里，也能正常进版本管理。
;
; 命名约定建议：Event.<模块>.<动作>
; 手写的格式是（前缀 + 号表示追加，不要删掉加号）：
;   +GameplayTagList=(Tag="Event.Grid.BlockMoved",DevComment="地块移动结束")
; ---------------------------------------------------------------------------
